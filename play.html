<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
  <title>辦案中 · SQL 偵探事務所</title>
  <meta name="description" content="SQL 偵探事務所遊戲主畫面：劇情、SQL 查詢區與證據板。" />
  <meta name="robots" content="noindex" />
  <meta property="og:site_name" content="SQL 偵探事務所" />
  <meta property="og:title" content="SQL 偵探事務所：潮港市檔案" />
  <meta property="og:image" content="./images/og.jpg" />
  <meta property="og:image:alt" content="夜晚的潮港市港口，桌上放著案件檔案夾與放大鏡" />
  <meta property="og:description" content="用 SQL 破解潮港市的六起案件。" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="./favicon.ico" sizes="48x48" />
  <link rel="apple-touch-icon" href="./images/apple-touch-icon.png" />
  <link rel="stylesheet" href="./css/style.css?v=20260914-03" />
</head>
<body class="min-h-dvh">
  <a href="#editor" class="sr-only z-60 rounded-lg bg-amber px-6 py-3 font-bold text-ink-950 focus:not-sr-only focus:fixed focus:left-4 focus:top-4">跳至查詢區</a>

  <header class="sticky top-0 z-40 border-b border-ink-800/80 bg-ink-950/90 backdrop-blur">
    <div class="mx-auto flex max-w-[1600px] flex-wrap items-center gap-x-4 gap-y-2 px-4 py-2">
      <a href="./" class="flex items-center gap-2 font-black tracking-wide" aria-label="回首頁">
        <img src="./images/icon/icon-badge.svg" alt="" width="28" height="28" class="size-7" />
        <span class="hidden sm:inline">SQL 偵探事務所</span>
      </a>
      <label class="flex items-center gap-2 text-sm text-ink-300">
        <span class="sr-only">選擇章節</span>
        <select id="chapter-select" class="select-sd"></select>
      </label>
      <div id="chapter-progress" class="hidden min-w-40 flex-col gap-1 sm:flex" aria-label="本章進度">
        <div class="flex items-center justify-between gap-3 text-xs text-ink-300"><span id="progress-label">任務 0 / 0</span><span id="star-total" title="累計星數">★ 0</span></div>
        <div class="progress"><span id="progress-fill"></span></div>
      </div>
      <div class="ml-auto flex items-center gap-2">
        <button type="button" id="btn-cheatsheet" class="btn-ghost btn-sm" aria-haspopup="dialog">語法小抄</button>
        <details id="more-menu" class="menu">
          <summary class="btn-ghost btn-sm" aria-label="更多功能">⋯</summary>
          <div class="menu-panel">
            <a href="./schema.html" class="menu-item">資料表總覽</a>
            <button type="button" id="btn-reset-db" class="menu-item" title="把資料庫還原成初始狀態">重置資料庫</button>
          </div>
        </details>
      </div>
    </div>
    <!-- 手機：三面板切換 -->
    <div id="pane-tabs" class="flex border-t border-ink-800 lg:hidden" role="tablist" aria-label="面板">
      <button type="button" class="pane-tab" role="tab" aria-selected="true" data-pane="story">劇情</button>
      <button type="button" class="pane-tab" role="tab" aria-selected="false" data-pane="editor">查詢</button>
      <button type="button" class="pane-tab" role="tab" aria-selected="false" data-pane="board">證據板</button>
    </div>
  </header>

  <!-- 章節開場：選章或首次進入時先落在這裡，把「這章要學什麼」定錨後再進入三欄辦案畫面 -->
  <section id="chapter-intro" class="mx-auto w-full max-w-5xl px-4 py-6" aria-label="章節開場" hidden></section>

  <main id="main" data-focus="read" class="mx-auto grid max-w-[1600px] gap-4 px-4 py-4 lg:grid-cols-[minmax(20rem,26rem)_1fr_minmax(16rem,20rem)]">
    <!-- 劇情／教學／任務 -->
    <section id="pane-story" data-pane="story" class="flex min-w-0 flex-col gap-3" aria-label="劇情與任務">
      <div id="step-card" class="card min-h-[24rem]" aria-live="polite"></div>
      <div class="flex items-center justify-between gap-2">
        <button type="button" id="btn-prev" class="btn-ghost btn-sm">← 上一步</button>
        <span id="step-count" class="text-sm text-ink-300"></span>
        <button type="button" id="btn-next" class="btn-primary btn-sm">下一步 →</button>
      </div>
    </section>

    <!-- 查詢區 -->
    <section id="pane-editor" data-pane="editor" class="flex min-w-0 flex-col gap-3" aria-label="SQL 查詢區" hidden>
      <div id="editor-card" class="card flex flex-col gap-3 p-4">
        <div id="editor-cue" class="cue" hidden>
          <span class="cue-dot" aria-hidden="true"></span>
          <p class="flex-1 text-sm leading-6"><strong class="text-amber">現在：</strong><span id="editor-cue-text">在這裡輸入 SQL 完成任務</span></p>
        </div>
        <div class="flex flex-wrap items-center justify-between gap-2">
          <p class="eyebrow">SQL 查詢區 · MariaDB 語法</p>
          <div class="flex items-center gap-2">
            <button type="button" id="btn-clear" class="btn-ghost btn-sm">清空</button>
            <button type="button" id="btn-run" class="btn-primary btn-sm">執行 <kbd class="ml-1 rounded bg-ink-950/40 px-1.5 py-0.5 font-mono text-xs font-normal">Ctrl+Enter</kbd></button>
          </div>
        </div>
        <label for="editor" class="sr-only">SQL 輸入</label>
        <textarea id="editor" class="sql" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="在這裡輸入 SQL，例如：SELECT * FROM person LIMIT 5;"></textarea>
        <p id="db-status" class="text-xs text-ink-300">正在載入資料庫…</p>
      </div>
      <!-- 檢核結果就地顯示在結果區上方，讀者不必把視線移回左欄 -->
      <div id="result-feedback" aria-live="assertive" hidden></div>
      <div id="results" class="flex flex-col gap-3" aria-live="polite" aria-label="查詢結果"></div>
    </section>

    <!-- 證據板 + 資料表 -->
    <aside id="pane-board" data-pane="board" class="flex min-w-0 flex-col gap-3" aria-label="證據板與資料表" hidden>
      <div class="card p-4">
        <div class="flex items-center justify-between">
          <p class="eyebrow">證據板</p>
          <span id="clue-count" class="chip">0 條線索</span>
        </div>
        <label class="mt-2 flex min-h-11 items-center gap-2 text-xs text-ink-300"><input type="checkbox" id="board-all" class="size-4 accent-amber" /> 顯示所有章節的線索</label>
        <div id="board" class="mt-1 grid max-h-[32rem] gap-3 overflow-y-auto pr-1 pt-2"></div>
        <div id="board-empty" class="mt-3 flex flex-col items-center gap-2 text-center">
          <img src="./images/empty/board-empty.webp" alt="" width="128" height="128" class="empty-art" loading="lazy" />
          <p id="board-empty-text" class="text-sm text-ink-300">完成任務後，線索會釘在這裡。</p>
        </div>
      </div>
      <div class="card p-4">
        <div class="flex items-center justify-between">
          <p class="eyebrow">資料表</p>
          <span class="text-xs text-ink-300">點欄位可插入</span>
        </div>
        <div id="schema-list" class="mt-3 flex flex-col gap-1 text-sm"></div>
      </div>
      <div class="card p-4">
        <p class="eyebrow">徽章</p>
        <div id="badge-list" class="mt-3 grid grid-cols-4 gap-2"></div>
      </div>
    </aside>
  </main>

  <!-- 語法小抄 -->
  <dialog id="dlg-cheatsheet" class="sd" aria-labelledby="cheatsheet-title">
    <div class="flex items-center justify-between border-b border-ink-700 px-5 py-3">
      <h2 id="cheatsheet-title" class="text-lg font-bold">MariaDB 語法小抄</h2>
      <button type="button" class="btn-ghost btn-sm" data-close>關閉</button>
    </div>
    <div id="cheatsheet-body" class="max-h-[70vh] overflow-y-auto px-5 py-4"></div>
  </dialog>

  <!-- 徽章／結案 -->
  <dialog id="dlg-badge" class="sd" aria-labelledby="badge-title">
    <div id="badge-body" class="flex flex-col items-center gap-4 px-6 py-8 text-center"></div>
  </dialog>

  <template id="tpl-loading">
    <div class="card flex flex-col items-center gap-3 text-center text-ink-300">
      <img src="./images/empty/db-loading.webp" alt="" width="128" height="128" class="empty-art" />
      <p><span class="mr-2 inline-block size-3 animate-pulse rounded-full bg-amber"></span>正在載入警局資料庫（約 1 MB，只需下載一次）…</p>
    </div>
  </template>
  <template id="tpl-results-empty">
    <div class="card flex flex-col items-center gap-3 text-center text-ink-300">
      <img src="./images/empty/results-empty.webp" alt="" width="128" height="128" class="empty-art" loading="lazy" />
      <p class="text-sm">查詢結果會顯示在這裡。試試 <code class="rounded bg-ink-800 px-1.5 py-0.5 font-mono text-teal">SHOW TABLES;</code></p>
    </div>
  </template>

  <script src="./vendor/sql-wasm.js"></script>
  <script src="./vendor/gsap.min.js"></script>
  <script src="./vendor/Flip.min.js"></script>
  <script src="./js/engine/seed.js?v=20260914-03"></script>
  <script src="./js/engine/mariadb-compat.js?v=20260914-03"></script>
  <script src="./js/engine/db.js?v=20260914-03"></script>
  <script src="./js/game/cast.js?v=20260914-03"></script>
  <script src="./js/game/media.js?v=20260914-03"></script>
  <script src="./js/chapters/ch0.js?v=20260914-03"></script>
  <script src="./js/chapters/ch1.js?v=20260914-03"></script>
  <script src="./js/chapters/ch2.js?v=20260914-03"></script>
  <script src="./js/chapters/ch3.js?v=20260914-03"></script>
  <script src="./js/chapters/ch4.js?v=20260914-03"></script>
  <script src="./js/chapters/ch5.js?v=20260914-03"></script>
  <script src="./js/chapters/ch6.js?v=20260914-03"></script>
  <script src="./js/chapters/expect.js?v=20260914-03"></script>
  <script src="./js/game/state.js?v=20260914-03"></script>
  <script src="./js/game/check.js?v=20260914-03"></script>
  <script src="./js/game/cheatsheet.js?v=20260914-03"></script>
  <script src="./js/game/highlight.js?v=20260914-03"></script>
  <script src="./js/game/play.js?v=20260914-03" defer></script>
</body>
</html>
